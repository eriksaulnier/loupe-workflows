version: 2
updates:
  # This repository is three repositories' write-token jobs, so a stale action here is stale in all
  # of them at once and nothing in a caller would show it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    # A week's wait before a new release is proposed, so one pulled soon after publishing never
    # lands. Our own releases are exempt.
    cooldown:
      default-days: 7
      exclude: ["secondshift-labs/*"]
    # ci/capture, ci/save and publish.yml are pinned to one loupe release commit and MUST move
    # together, so one loupe release arrives as one pull request.
    groups:
      loupe:
        patterns: ["secondshift-labs/loupe*"]
